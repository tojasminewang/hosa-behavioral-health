<div class="dg"><div class="mx"><span></span><span class="mh">Observer says yes</span><span class="mh">Observer says no</span><span class="mh rh">Stimulus is there</span><div class="nd c5"><b>Hit</b><small>e.g., a radiologist correctly spotting cancer on a mammogram</small></div><div class="nd c3"><b>Miss</b></div><span class="mh rh">Nothing is there</span><div class="nd c3"><b>False alarm</b></div><div class="nd c5"><b>Correct rejection</b></div></div><div class="dnote">Which outcome happens depends on the stimulus’s intensity and on the observer’s criteria: maximize hits or minimize misses.</div></div>
